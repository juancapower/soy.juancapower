name: Deploy Vite site to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Generate static entry points for SPA routes
        shell: bash
        run: |
          mkdir -p dist/libera-tu-proposito
          cp dist/index.html dist/libera-tu-proposito/index.html
          cp dist/index.html dist/404.html

      - name: Verify generated entry points
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/libera-tu-proposito/index.html
          echo "SPA entry points generated correctly"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
